<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E3A1"/>
      <stop offset="25%" stop-color="#E0B44F"/>
      <stop offset="50%" stop-color="#C58F2C"/>
      <stop offset="75%" stop-color="#F1D78A"/>
      <stop offset="100%" stop-color="#B07A22"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E3A1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E0B44F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B07A22" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- ================= CROWN (MUKUT) ================= -->
  <!-- Top Finial / Kalash -->
  <path d="M100 12 C98 16 96 22 100 28 C104 22 102 16 100 12 Z" fill="url(#goldFill)" stroke-width="1.2"/>
  <circle cx="100" cy="8" r="2" fill="url(#goldGrad)" stroke="none"/>
  
  <!-- Tier 1 -->
  <path d="M92 34 C94 28 97 26 100 26 C103 26 106 28 108 34" stroke-width="1.8"/>
  <path d="M88 42 C92 38 96 36 100 36 C104 36 108 38 112 42" stroke-width="1.6"/>
  <circle cx="100" cy="31" r="1.5" fill="url(#goldGrad)" stroke="none"/>

  <!-- Tier 2 & Main Crown Body -->
  <path d="M84 52 C88 45 94 43 100 43 C106 43 112 45 116 52" stroke-width="2"/>
  <path d="M78 64 C82 56 90 53 100 53 C110 53 118 56 122 64" stroke-width="2.2"/>
  
  <!-- Crown Side Wings / Peaks -->
  <path d="M78 64 C73 58 70 50 72 44 C76 46 80 50 84 52" stroke-width="1.5"/>
  <path d="M122 64 C127 58 130 50 128 44 C124 46 120 50 116 52" stroke-width="1.5"/>
  
  <!-- Crown Jewels & Horizontal Band -->
  <path d="M75 66 C83 69 91 70 100 70 C109 70 117 69 125 66" stroke-width="2.2"/>
  <path d="M76 71 C84 74 92 75 100 75 C108 75 116 74 124 71" stroke-width="1.4"/>
  <circle cx="88" cy="62" r="1.3" fill="url(#goldGrad)" stroke="none"/>
  <circle cx="100" cy="60" r="1.8" fill="url(#goldGrad)" stroke="none"/>
  <circle cx="112" cy="62" r="1.3" fill="url(#goldGrad)" stroke="none"/>

  <!-- ================= FOREHEAD & TILAK ================= -->
  <!-- Sacred Tilak / Trishul mark -->
  <path d="M100 74 V89" stroke-width="2.4"/>
  <path d="M96 79 Q100 83 104 79" stroke-width="1.6"/>
  <path d="M93 83 Q100 88 107 83" stroke-width="1.4"/>
  <circle cx="100" cy="92" r="2" fill="url(#goldGrad)" stroke="none"/>

  <!-- Brows & Brow Highlights -->
  <path d="M84 88 Q92 84 98 87" stroke-width="1.6"/>
  <path d="M116 88 Q108 84 102 87" stroke-width="1.6"/>

  <!-- Eyes -->
  <path d="M82 94 Q88 91 93 95" stroke-width="1.5"/>
  <path d="M118 94 Q112 91 107 95" stroke-width="1.5"/>

  <!-- ================= EARS (FAN-SHAPED WITH INNER RHYTHM) ================= -->
  <!-- Left Ear (Viewer's Left) -->
  <path d="M74 69 C60 67 42 74 38 90 C34 106 44 122 56 126 C64 128 72 125 76 120" stroke-width="2.2"/>
  <!-- Inner contour left ear -->
  <path d="M68 78 C56 78 47 85 45 97 C43 108 50 118 60 120" stroke-width="1.2" opacity="0.85"/>
  <path d="M54 94 C56 102 61 108 68 110" stroke-width="1" opacity="0.6"/>

  <!-- Right Ear (Viewer's Right) -->
  <path d="M126 69 C140 67 158 74 162 90 C166 106 156 122 144 126 C136 128 128 125 124 120" stroke-width="2.2"/>
  <!-- Inner contour right ear -->
  <path d="M132 78 C144 78 153 85 155 97 C157 108 150 118 140 120" stroke-width="1.2" opacity="0.85"/>
  <path d="M146 94 C144 102 139 108 132 110" stroke-width="1" opacity="0.6"/>

  <!-- ================= TUSK (DANT) ================= -->
  <!-- Right broken/single tusk (viewer's left side) -->
  <path d="M88 114 L82 118 L88 120 Z" fill="url(#goldFill)" stroke-width="1"/>
  <!-- Left full tusk (viewer's right side) -->
  <path d="M112 114 L119 120 L113 121 Z" fill="url(#goldFill)" stroke-width="1"/>

  <!-- ================= TRUNK (CURVING LEFT) ================= -->
  <!-- Main Trunk Outline -->
  <path d="M94 97 C92 110 93 126 90 142 C86 160 76 168 64 162 C54 157 52 142 62 134 C70 128 78 134 78 140 C78 145 74 148 70 147" stroke-width="2.4"/>
  <path d="M106 97 C108 112 108 130 102 148 C96 164 88 174 74 174 C60 174 46 162 48 142 C50 124 66 118 78 124" stroke-width="2"/>
  
  <!-- Trunk Horizontal Folds / Rings -->
  <path d="M93 108 Q100 111 106 108" stroke-width="1.3"/>
  <path d="M92 116 Q99 119 105 116" stroke-width="1.3"/>
  <path d="M91 125 Q98 128 104 125" stroke-width="1.3"/>
  <path d="M90 134 Q96 137 102 134" stroke-width="1.3"/>
  <path d="M88 144 Q93 148 98 145" stroke-width="1.3"/>

  <!-- Modak / Ladoo at Trunk Tip -->
  <circle cx="68" cy="141" r="3.5" fill="url(#goldGrad)" stroke="none"/>
  <circle cx="64" cy="138" r="1.5" fill="url(#goldGrad)" stroke="none"/>
  <circle cx="72" cy="138" r="1.5" fill="url(#goldGrad)" stroke="none"/>

  <!-- ================= TORSO, HANDS & BODY ================= -->
  <!-- Right Hand in Abhaya Mudra (Viewer's Left - Blessing) -->
  <path d="M42 134 C36 142 34 155 42 165 C48 172 56 172 62 168" stroke-width="1.8"/>
  <path d="M40 144 C34 146 30 152 34 158" stroke-width="1.4"/>
  <!-- Auspicious Palm / Swastik dot -->
  <circle cx="43" cy="153" r="1.5" fill="url(#goldGrad)" stroke="none"/>

  <!-- Left Hand holding bowl/modak (Viewer's Right) -->
  <path d="M158 134 C164 144 165 158 156 168 C148 175 138 172 132 165" stroke-width="1.8"/>
  <path d="M142 160 C146 165 152 166 156 162" stroke-width="1.4"/>
  <!-- Modak on left bowl -->
  <path d="M144 158 C144 152 148 150 151 154 C154 150 158 152 158 158 Z" fill="url(#goldFill)" stroke-width="1"/>

  <!-- Bell-Shaped Belly (Lambodara) & Sacred Thread (Janva / Yajnopavita) -->
  <path d="M78 175 C84 186 92 192 102 192 C115 192 124 184 128 172" stroke-width="2"/>
  <!-- Sacred thread crossing diagonally -->
  <path d="M84 148 C94 162 104 176 118 184" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.85"/>

  <!-- ================= SEATED LEGS & BASE (PADMASANA) ================= -->
  <!-- Left Thigh/Knee Fold (Viewer's Left) -->
  <path d="M34 185 C24 195 24 208 38 214 C56 220 84 216 100 208" stroke-width="2.2"/>
  <path d="M40 196 C48 206 66 211 84 211" stroke-width="1.2" opacity="0.7"/>

  <!-- Right Thigh/Knee Fold (Viewer's Right) -->
  <path d="M166 185 C176 195 176 208 162 214 C144 220 116 216 100 208" stroke-width="2.2"/>
  <path d="M160 196 C152 206 134 211 116 211" stroke-width="1.2" opacity="0.7"/>

  <!-- ================= LOTUS PEDESTAL / BASE FLOURISH ================= -->
  <!-- Base Center Lotus Petal -->
  <path d="M100 212 C96 219 92 226 100 232 C108 226 104 219 100 212 Z" fill="url(#goldFill)" stroke-width="1.2"/>
  <!-- Flanking Petals Left -->
  <path d="M92 215 C84 221 78 226 86 231 C94 231 96 224 96 217" stroke-width="1.4"/>
  <path d="M78 218 C68 223 62 227 70 230 C78 230 82 225 84 219" stroke-width="1.2"/>
  <!-- Flanking Petals Right -->
  <path d="M108 215 C116 221 122 226 114 231 C106 231 104 224 104 217" stroke-width="1.4"/>
  <path d="M122 218 C132 223 138 227 130 230 C122 230 118 225 116 219" stroke-width="1.2"/>
  
  <!-- Base Grounding Line with Terminal Dots -->
  <path d="M48 230 H152" stroke-width="1.2" opacity="0.6"/>
  <circle cx="46" cy="230" r="1.5" fill="url(#goldGrad)" stroke="none"/>
  <circle cx="154" cy="230" r="1.5" fill="url(#goldGrad)" stroke="none"/>
</svg>
